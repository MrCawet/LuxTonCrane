name: Préparer la compilation Android
description: Java 17, la cible Rust Android et cargo-ndk. Le SDK et le NDK Android sont déjà sur les machines ubuntu de GitHub.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
    - uses: gradle/actions/setup-gradle@v6
    - name: Cible Rust Android et cargo-ndk
      shell: bash
      run: |
        rustup target add aarch64-linux-android
        cargo install cargo-ndk --locked
