[package]
name = "pont"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Seulement pour générer le code Kotlin du pont, pas dans la bibliothèque livrée sur Android.
bindgen = ["uniffi/cli"]

[dependencies]
journal = { path = "../journal" }
journal_sqlite = { path = "../journal_sqlite" }
mesure = { path = "../mesure" }
# Génère le code Kotlin qui appelle ce pont.
uniffi = "0.32.2"
